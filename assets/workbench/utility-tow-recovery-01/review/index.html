<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utility Tow Recovery 01 — Procedural Candidate Review</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #9b9389; }
      body { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #review-panel {
        position: fixed; left: 16px; top: 16px; z-index: 2; max-width: 360px;
        padding: 14px 16px; border: 1px solid rgba(255,255,255,.28); border-radius: 12px;
        background: rgba(20, 24, 28, .82); backdrop-filter: blur(12px); box-shadow: 0 12px 36px rgba(0,0,0,.22);
      }
      h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: .02em; }
      p { margin: 4px 0; color: #d5d9dc; font-size: 12px; line-height: 1.4; }
      #status { color: #a9e5b0; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      button { cursor: pointer; border: 1px solid #72808a; border-radius: 7px; padding: 6px 8px; color: #eef3f5; background: #35404a; font-size: 11px; }
      button[aria-pressed="true"] { border-color: #f3c77a; background: #625037; }
      #reference { position: fixed; right: 16px; top: 16px; width: 210px; z-index: 2; border-radius: 10px; opacity: .88; box-shadow: 0 12px 32px rgba(0,0,0,.24); }
      @media (max-width: 760px) { #reference { display: none; } #review-panel { max-width: calc(100vw - 32px); } }
    </style>
  </head>
  <body>
    <div id="review-panel">
      <h1>Utility Tow Recovery 01 · procedural candidate review</h1>
      <p id="status">Loading authored factory…</p>
      <p>Candidate bound to the derived rig envelope (track 3.0 m, wheelbase 4.2 m, front tyre r 0.765 m, rear tyre r 0.935 m). Interaction, collision, and runtime wiring remain separate contracts.</p>
      <div class="controls" id="view-controls"></div>
      <div class="controls" id="light-controls"></div>
    </div>
    <img id="reference" src="/assets/generated/rig_concepts/heavy_utility_tow_recovery_01_concept.png" alt="Utility Tow Recovery 01 concept reference" />
    <script type="module" src="./main.ts"></script>
  </body>
</html>
