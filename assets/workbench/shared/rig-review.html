<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rig Workbench — Shared Candidate Review</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #9b9389; }
      body { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #review-panel {
        position: fixed; left: 16px; top: 16px; z-index: 2; max-width: 360px;
        padding: 14px 16px; border: 1px solid rgba(255,255,255,.28); border-radius: 12px;
        background: rgba(20, 24, 28, .82); backdrop-filter: blur(12px); box-shadow: 0 12px 36px rgba(0,0,0,.22);
      }
      h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: .02em; }
      p { margin: 4px 0; color: #d5d9dc; font-size: 12px; line-height: 1.4; }
      #status { color: #a9e5b0; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      button { cursor: pointer; border: 1px solid #72808a; border-radius: 7px; padding: 6px 8px; color: #eef3f5; background: #35404a; font-size: 11px; }
      button[aria-pressed="true"] { border-color: #f3c77a; background: #625037; }
      @media (max-width: 860px) { #review-panel { max-width: calc(100vw - 32px); } }
    </style>
  </head>
  <body>
    <div id="review-panel">
      <h1>Rig workbench · shared candidate review</h1>
      <p id="status">Loading authored factory…</p>
      <p>Pass <code>?rig=&lt;workbench-id&gt;</code> to review any authored rig factory. Named viewpoints and lighting modes feed the evidence-capture harness.</p>
      <div class="controls" id="view-controls"></div>
      <div class="controls" id="light-controls"></div>
    </div>
    <script type="module" src="./rig-review-main.ts"></script>
  </body>
</html>
